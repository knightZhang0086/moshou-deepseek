# Render 部署示例（免费档）
#
# 使用步骤：
# 1. 将仓库推送到 GitHub/GitLab；
# 2. Render 控制台：New → Web Service → Deploy from Git repo（自动识别本文件）；
# 3. Render 会自动注入 PORT 环境变量（免费档固定 10000），服务器按 PORT 监听；
# 4. 健康检查：GET /healthz → {"ok":true}（healthCheckPath 已配置）。
services:
  - type: web
    name: moshou-chenggui-server
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
